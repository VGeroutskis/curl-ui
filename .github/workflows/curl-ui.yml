name: curl-ui

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          # the oldest supported runners set a low glibc floor for the packages
          - { runner: ubuntu-22.04, arch: x86_64 }
          - { runner: ubuntu-22.04-arm, arch: aarch64 }
    name: linux-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake libsdl2-dev rpm dpkg-dev curl
      - name: Option table matches the pinned curl release
        run: |
          python3 tools/gen_options.py
          git diff --exit-code src/core/options_data.c
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build -j4
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Screenshot smoke test
        env:
          SDL_VIDEODRIVER: dummy
        run: ./build/curl-ui --add location --docs location --screenshot smoke.bmp && test -s smoke.bmp
      - name: Live tests of the app
        env:
          SDL_VIDEODRIVER: dummy
          PYTHONUTF8: 1
        run: |
          python3 tests/live/test_large.py --ui build/curl-ui
          python3 tests/live/test_tabs.py --ui build/curl-ui
          python3 tests/live/test_vars.py --ui build/curl-ui
          python3 tests/live/test_mask.py --ui build/curl-ui
          python3 tests/live/test_params.py --ui build/curl-ui
          python3 tests/live/test_forms.py --ui build/curl-ui
          python3 tests/live/test_store.py --ui build/curl-ui
      - name: Sanitizers
        run: |
          cmake -S . -B build-san -DCMAKE_BUILD_TYPE=Debug -DCURLUI_SANITIZE=ON -DCURLUI_BUILD_GUI=OFF
          cmake --build build-san -j4
          # all_args spawns ASan processes by the thousand, which takes over 8 minutes
          # on the ARM runner against 33 seconds on x86_64, where it still runs
          ctest --test-dir build-san --output-on-failure ${{ matrix.arch == 'aarch64' && '-E all_args' || '' }}
      - name: Package
        run: cd build && cpack
      - name: Inspect packages
        run: |
          dpkg-deb -I build/*.deb
          dpkg-deb -f build/*.deb Depends | grep -q libsdl2
          rpm -qpR build/*.rpm
          rpm -qpR build/*.rpm | grep -q 'libSDL2-2.0.so.0'
          objdump -T build/curl-ui | grep -oE 'GLIBC_[0-9.]+' | sort -Vu | tail -1
      - name: Install the .deb and run it
        env:
          SDL_VIDEODRIVER: dummy
        run: |
          sudo apt-get install -y ./build/curl-ui_*.deb
          curl-ui --docs location --screenshot installed.bmp
          test -s installed.bmp
      - name: Build the AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
          ARCH: ${{ matrix.arch }}
        run: |
          version=$(sed -n 's/^project(curl-ui VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          curl -fsSL -o linuxdeploy "https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20251107-1/linuxdeploy-$ARCH.AppImage"
          chmod +x linuxdeploy
          cmake --install build --prefix AppDir/usr
          OUTPUT="build/curl-ui-$version-linux-$ARCH.AppImage" ./linuxdeploy --appdir AppDir \
            --desktop-file packaging/curl-ui.desktop --icon-file packaging/curl-ui.png --output appimage
      - name: Run the AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
          SDL_VIDEODRIVER: dummy
        run: |
          ./build/curl-ui-*.AppImage --docs location --screenshot "$PWD/appimage.bmp"
          test -s appimage.bmp
      - uses: actions/upload-artifact@v7
        with:
          name: curl-ui-linux-${{ matrix.arch }}
          path: |
            build/*.deb
            build/*.rpm
            build/*.tar.gz
            build/*.AppImage
          if-no-files-found: error

  windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: windows-latest, platform: x64, arch: x64 }
          - { runner: windows-11-arm, platform: ARM64, arch: arm64 }
    name: windows-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - name: Install NSIS
        run: choco install nsis -y --no-progress
      - name: Configure
        run: cmake -S . -B build -A ${{ matrix.platform }}
      - name: Build
        run: cmake --build build --config Release -j4
      - name: Test
        # C:\Windows\System32\curl.exe does the end-to-end transfer
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Screenshot smoke test
        env:
          SDL_VIDEODRIVER: dummy
        run: |
          $p = Start-Process -Wait -PassThru -FilePath build\Release\curl-ui.exe -ArgumentList '--add location --docs location --screenshot smoke.bmp'
          if ($p.ExitCode -ne 0 -or -not (Test-Path smoke.bmp)) { exit 1 }
      - name: Live tests of the app
        env:
          SDL_VIDEODRIVER: dummy
          PYTHONUTF8: 1
        run: |
          python tests/live/test_large.py --ui build/Release/curl-ui.exe
          python tests/live/test_tabs.py --ui build/Release/curl-ui.exe
          python tests/live/test_vars.py --ui build/Release/curl-ui.exe
          python tests/live/test_mask.py --ui build/Release/curl-ui.exe
          python tests/live/test_params.py --ui build/Release/curl-ui.exe
          python tests/live/test_forms.py --ui build/Release/curl-ui.exe
          python tests/live/test_store.py --ui build/Release/curl-ui.exe
      - name: Package
        working-directory: build
        run: cpack -C Release
      - name: Install, run and uninstall the installer
        env:
          SDL_VIDEODRIVER: dummy
        run: |
          $installer = (Get-ChildItem build\curl-ui-*.exe).FullName
          $p = Start-Process -Wait -PassThru -FilePath $installer -ArgumentList '/S'
          if ($p.ExitCode -ne 0) { exit 1 }
          $dir = "$env:ProgramFiles\curl UI"
          $p = Start-Process -Wait -PassThru -FilePath "$dir\curl-ui.exe" -ArgumentList "--docs location --screenshot $env:TEMP\installed.bmp"
          if ($p.ExitCode -ne 0 -or -not (Test-Path "$env:TEMP\installed.bmp")) { exit 1 }
          $p = Start-Process -Wait -PassThru -FilePath "$dir\Uninstall.exe" -ArgumentList '/S'
          if ($p.ExitCode -ne 0) { exit 1 }
      - uses: actions/upload-artifact@v7
        with:
          name: curl-ui-windows-${{ matrix.arch }}
          path: |
            build/curl-ui-*.exe
            build/curl-ui-*.zip
          if-no-files-found: error

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15-intel, arch: x86_64, name: intel }
          - { runner: macos-15, arch: arm64, name: apple-silicon }
    name: macos-${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }}
      - name: Build
        run: cmake --build build -j4
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Check the binary's architecture
        run: test "$(lipo -archs "build/curl UI.app/Contents/MacOS/curl UI")" = "${{ matrix.arch }}"
      - name: Screenshot smoke test
        env:
          SDL_VIDEODRIVER: dummy
        run: |
          "build/curl UI.app/Contents/MacOS/curl UI" --add location --docs location --screenshot "$PWD/smoke.bmp"
          test -s smoke.bmp
      - name: Live tests of the app
        env:
          SDL_VIDEODRIVER: dummy
          PYTHONUTF8: 1
        run: |
          python3 tests/live/test_large.py --ui "build/curl UI.app/Contents/MacOS/curl UI"
          python3 tests/live/test_tabs.py --ui "build/curl UI.app/Contents/MacOS/curl UI"
          python3 tests/live/test_vars.py --ui "build/curl UI.app/Contents/MacOS/curl UI"
          python3 tests/live/test_mask.py --ui "build/curl UI.app/Contents/MacOS/curl UI"
          python3 tests/live/test_params.py --ui "build/curl UI.app/Contents/MacOS/curl UI"
          python3 tests/live/test_forms.py --ui "build/curl UI.app/Contents/MacOS/curl UI"
          python3 tests/live/test_store.py --ui "build/curl UI.app/Contents/MacOS/curl UI"
      - name: Package
        run: cd build && cpack
      - name: Open the .dmg and run the app from it
        env:
          SDL_VIDEODRIVER: dummy
        run: |
          # the .dmg shows the license first; answer it, as a person would
          yes | PAGER=cat hdiutil attach build/*.dmg -mountpoint /tmp/curl-ui-dmg -nobrowse
          "/tmp/curl-ui-dmg/curl UI.app/Contents/MacOS/curl UI" --docs location --screenshot "$PWD/dmg.bmp"
          test -s dmg.bmp
          hdiutil detach /tmp/curl-ui-dmg
      - uses: actions/upload-artifact@v7
        with:
          name: curl-ui-macos-${{ matrix.name }}
          path: build/*.dmg
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          mkdir release
          mv dist/*/* release/
          (cd release && sha256sum -- * > SHA256SUMS)
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "curl UI $TAG" --generate-notes release/*
